<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Loja — ClínicaPETMais</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand small">
        <svg class="logo" width="44" height="44" viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="32" r="30" fill="#2c98a8"/>
        </svg>
        <div>
          <h1 class="brand-title">ClínicaPETMais</h1>
        </div>
      </div>

      <nav class="main-nav" aria-label="Principal">
        <a href="index.html">Início</a>
        <a href="agendamentos.html">Agendamentos</a>
        <a href="loja.html" class="active">Loja</a>
      </nav>
    </div>
  </header>

  <main class="container page">
    <div class="store-header">
      <h2>Loja PET</h2>
      <div class="store-actions">
        <button id="cartToggle" class="cart-btn">🛒 Carrinho <span id="cartCount" class="badge">0</span></button>
      </div>
    </div>

    <section id="products" class="product-grid">
      <!-- Produtos serão renderizados pelo JS -->
    </section>
  </main>

  <!-- Carrinho lateral flutuante -->
  <aside id="cartPanel" class="cart">
    <div class="cart-top">
      <h3>Seu Carrinho</h3>
      <button id="closeCart" class="close-cart" aria-label="Fechar carrinho">✕</button>
    </div>

    <ul id="cartItems" class="list"></ul>

    <div class="cart-footer">
      <div class="cart-summary">
        <div>Subtotal</div>
        <div class="cart-total">R$ <span id="cartTotal">0.00</span></div>
      </div>

      <div class="cart-actions">
        <button id="clearCart" class="btn btn-outline">Limpar carrinho</button>
        <button id="checkoutBtn" class="btn">Finalizar compra</button>
      </div>
    </div>
  </aside>

  <div id="overlay" class="overlay"></div>

  <footer class="site-footer">
    <div class="container">
      
    </div>
  </footer>

  <script src="Js/shared.js" defer></script>
  <script src="Js/loja.js" defer></script>
</body>
</html>
